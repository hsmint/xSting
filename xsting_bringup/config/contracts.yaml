# Development contracts only. Values are initial test budgets, not measured guarantees.
schema_version: 1
hardware_ready: false
model_ready: false
frames:
  arm: arm_base
qos:
  detections: {reliability: best_effort, durability: volatile, depth: 1}
  arm_input: {reliability: reliable, durability: volatile, depth: 1}
  arm_target: {reliability: reliable, durability: volatile, depth: 1}
queues:
  waiting_frames: 1
  waiting_arm_inputs: 1
workers:
  task_ros: 2
  arm_ros: 1
  arm_inference: 1
  vision_ros: 2
  vision_inference: 1
limits:
  detection_age_ms: 100
  arm_input_age_ms: 100
  host_feedback_timeout_ms: 100
# Firmware currently has its own timeout; this host proposal does not alter it.
