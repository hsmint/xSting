# DOPE 사각기둥 퍽 설정
class: square_puck            # 빨강/초록 구분 없음 (색은 YOLO 나 픽셀 색으로 구분)
dimensions_cm: [3.0, 3.0, 6.0]  # x y z, z = 긴 축
input: 1280x720 원본 그대로 (400 px 로 줄이지 말 것)
postprocess:
  sigma: 1            # DOPE 기본 3
  thresh_map: 0.01
  thresh_points: 0.1
  thresh_angle: 0.5
  min_points: 6       # 꼭짓점+중심 9개 중 6개 이상이면 PnP
