/**:
  ros__parameters:
    # 계획 파이프라인(cumotion 우선 사용, 미설치 시 ompl 자동 전환) 및 공중 이동 속도 배율
    pipeline: "ompl"
    vel_scale: 0.70
    acc_scale: 0.60

    # 지면 높이 및 205x205x70 상자 기본 중심 좌표(base 프레임 기준, m)
    ground_z: -0.0213
    box_x: 0.285
    box_y: 0.0
    auto_box_det: true

    # 팔 ArduCam Eye-in-Hand 수직 관측 정밀 보정 활성화 및 상자 상판 대비 카메라 높이(m)
    use_arducam: true
    arducam_look_dz: 0.235

    # 그리퍼 개폐 위치(finger_l, m: 간격=19.9mm+2*q -> 30mm 퍽 기준) 및 빈손 판정 임계치
    grip_open_box: 0.0175
    grip_open_slot: 0.0103
    grip_loosen: 0.0088
    grip_close: 0.0008
    check_grasp: true
    grip_empty_th: 0.0045

    # 안전 호버 높이(base 기준 패드 중심 Z, m: 바스켓 기적재 60mm 퍽 상단 완전 회피)
    box_hover_z: 0.215
    slot_hover_z: 0.318

    # 실기 파지·배치·슬롯·기립 미세 오프셋(m) 및 팔 처짐 보정 계수
    pick_off_x: 0.00600
    pick_off_y: 0.0
    pick_off_z: 0.00900
    place_off_x: 0.0
    place_off_y: 0.0
    place_off_z: 0.01200
    slot_off_x: -0.00250
    slot_off_y: 0.00030
    slot_off_z: 0.0
    right_tip_r: 0.01900
    right_grasp_dz: 0.02100
    right_lift_dz: 0.08800
    right_off_z: 0.01600
    droop_r0: 0.200
    droop_k: 0.0
