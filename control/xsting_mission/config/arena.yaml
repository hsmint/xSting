# 경기장 데이터 (하나뿐인 원본). 좌표는 미션지 기준 mm (원점 = 왼쪽 아래 기둥 중심, 지도 위쪽이 +Y).
#
# 이 파일을 고치면 아래가 모두 따라 바뀐다:
#   - 가짜 경기장의 벽 지도, 경로 계산, 웹 화면, 출발 자세(start_pose)
#   - COMPARE_ROUTES 경로 길이
#   - 고정 프롬프트(prompts/mission.md)의 "경기장" 절 전체 (장소, 벽, 막힌 틈, 거리표)
#     → 고친 뒤 `python3 scripts/update_arena_prompt.py` 실행 (프롬프트를 다시 써야 AI가 안다)
# 고친 뒤에는 robot_command_server와 llm_commander를 다시 켠다.

frame_id: map  # 주행 좌표계. 원점이 경기장 원점과 같아야 한다 (cuVSLAM map 원점이 다르면 변환을 먼저 맞춘다)

# 장소
#   target: 대상 중심 [x, y]. 접근 자리는 로봇이 스스로 정한다 (가짜 경기장은 대상 둘레에서 무작위)
#   note:   프롬프트 장소 표의 "설명" 칸
places:
  HOME: {target: [734, 950],   note: "왼쪽 아래. 신호등과 바코드를 관측하는 곳 (-X 방향을 봄)"}
  S1:   {target: [1468, 950],  note: "아래쪽, HOME 오른쪽 (사이에 W1)"}
  S2:   {target: [3670, 3152], note: "오른쪽 중간"}
  S3:   {target: [2936, 5354], note: "위쪽, S5 오른쪽"}
  S4:   {target: [734, 5354],  note: "왼쪽 위"}
  S5:   {target: [2202, 5354], note: "위쪽 가운데"}
  S6:   {target: [3670, 3886], note: "오른쪽 중간, S2 바로 위 (사이에 W11)"}
  L1:   {target: [3670, 950],  note: "오른쪽 아래"}
  L2:   {target: [2202, 3700], note: "경기장 중앙"}
  L3:   {target: [3670, 5354], note: "오른쪽 위"}

# 출발·복귀 자세 [x, y, yaw_deg] (yaw는 +X 기준 반시계). 가짜 경기장의 시작 위치이자 GOTO HOME 도착 자리.
# 미션지의 관측 위치: 로봇 중심 (734, 950)에서 -X를 본다.
start_pose: [734, 950, 180]

# 바깥 벽: 기둥 중심 기준 사각형 [x, y] (0,0) ~ size. 미션지의 바깥 크기 4464×6364는 벽 바깥면 기준.
size: [4403, 6306]
wall_thickness: 30  # 벽판·기둥 두께. 지도에 벽을 이 두께로 그린다

# 안쪽 벽: 선분 from [x1, y1] → to [x2, y2] (양 끝 기둥 중심). 미션지 v5 2쪽 그림에서 잰 값.
# note는 프롬프트 벽 표의 "주변" 칸에 그대로 들어간다.
walls:
  W1:  {from: [1101, 660],  to: [1101, 1320], note: "HOME과 S1 사이"}
  W2:  {from: [1101, 1320], to: [1835, 1320], note: "S1 위쪽"}
  W3:  {from: [1835, 1320], to: [1835, 2053], note: "S1 위쪽 오른편"}
  W4:  {from: [1101, 2053], to: [1835, 2053], note: "W2 위쪽"}
  W5:  {from: [1101, 2053], to: [1101, 2787], note: "왼쪽 중간 아래"}
  W6:  {from: [1101, 3520], to: [1101, 4253], note: "왼쪽 중간 위"}
  W7:  {from: [367, 4253],  to: [1101, 4253], note: "왼쪽 중간 위"}
  W8:  {from: [2569, 1320], to: [4037, 1320], note: "L1 위쪽"}
  W9:  {from: [2569, 2053], to: [3303, 2053], note: "L1 위쪽, W8 위"}
  W10: {from: [3303, 2053], to: [3303, 3520], note: "S2 왼쪽"}
  W11: {from: [3303, 3520], to: [4037, 3520], note: "S2와 S6 사이"}
  W12: {from: [3303, 4253], to: [4037, 4253], note: "S6 위쪽"}
  W13: {from: [1101, 4987], to: [1101, 5720], note: "S4와 S5 사이"}
  W14: {from: [1835, 4987], to: [2569, 4987], note: "S5 아래쪽"}
  W15: {from: [2569, 4987], to: [2569, 5720], note: "S5와 S3 사이"}
  W16: {from: [3303, 4987], to: [3303, 5720], note: "S3와 L3 사이"}

# 가벽: 실제 벽은 아니지만 우리 팀이 정한 진입 금지선. 형식은 walls와 같다 (ID는 V1, V2, ...).
#   - 경로 계산·거리표·좁은 틈 계산에서는 벽과 똑같이 막는다
#   - 웹 화면에는 주황 점선으로, 프롬프트에는 "가벽" 표로 따로 나온다
#   - 실물 주행에는 반영되지 않는다 (로봇 팀 주행에 따로 넣어야 함)
# 예:  V1: {from: [1500, 2500], to: [1500, 3000], note: "중앙 왼쪽 통로 막기"}
virtual_walls:
  # V1_7: {from: [0, 4253],  to: [367, 4253], note: "왼쪽 중간 위"}

# 없을예정
# # 벽 말고 지나갈 수 없는 사각형 (중심, [가로, 세로])
# obstacles:
#   - {name: 중앙 받침대, center: [2202, 3500], size: [820, 820], note: "L2는 이 받침대 북쪽에 있다."}

box_size: 205  # 시작 박스 S1~S6, 하차 박스 L1~L3 (205×205×70). 모두 장애물로 본다

# 로봇 차체 (화면에 그리는 용도). 경로 계산에서 로봇은 점이고, 크기는 아래 costmap.padding으로만 반영한다.
robot:
  # footprint: base_footprint 기준 차체 외곽 다각형 [x, y] (+X 앞, +Y 왼쪽).
  #   URDF xsting_v62 차체 메시 범위: x -135 ~ 137 (앞뒤 272), y -199 ~ 199 (좌우 398). 팔은 접은 상태로 차체 안에 있다고 본다.
  footprint: [[137, 199], [137, -199], [-135, -199], [-135, 199]]

# 코스트맵. 경로 계산에서 로봇은 점이고, 벽·박스를 padding만큼 부풀려 로봇 크기를 반영한다.
costmap:
  padding: 250  # 벽·박스에서 이 거리 안으로는 로봇 중심이 못 들어간다 (화면 빨강). 로봇 폭 398의 절반 + 여유 50.
                #   폭 2 × padding(500mm)보다 좁은 틈은 막힌다

# 화면 표시용
start_zone: 600        # HOME 구역 크기 (추정)
signal_light: [80, 950]
barcode: [80, 650]
