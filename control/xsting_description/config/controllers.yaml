controller_manager:
  ros__parameters:
    update_rate: 50   # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    position_controller:
      type: forward_command_controller/ForwardCommandController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    interface_name: position

diff_drive_controller:
  ros__parameters:
    # Skid steer: two wheels per side, driven at the same speed.
    left_wheel_names: ["wheel_front_left_joint", "wheel_rear_left_joint"]
    right_wheel_names: ["wheel_front_right_joint", "wheel_rear_right_joint"]

    # Real robot geometry from the URDF (wheel joints at y = +-0.1439, wheel cylinder radius),
    # not the firmware's 0.160; the hardware plugin converts between the two.
    wheel_separation: 0.2878
    wheel_radius: 0.033
    # Skid steer slips sideways while turning; raise above 1.0 if odom over-counts rotation on the real robot.
    wheel_separation_multiplier: 1.0

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true

    # The firmware reports accumulated ticks, so odom from wheel position is more accurate than from velocity.
    position_feedback: true
    open_loop: false

    # Stop if /cmd_vel stops for 0.5 s. A PC-side guard, separate from the firmware heartbeat.
    cmd_vel_timeout: 0.5

    # Linear is set to the firmware cap: 0.266 m/s (77 rpm). The PC sends cmd_vel in 0.01 m/s
    # steps, so 0.27 rounds to 27 and the firmware clamps it to 0.266; 0.26 would stop at 75 rpm.
    # At full speed the motors have no headroom left, so a low battery or a loaded wheel can pull
    # the robot to one side. The angular cap works out to about 1.03 rad/s for this robot.
    linear.x.max_velocity: 0.27
    linear.x.min_velocity: -0.27
    linear.x.max_acceleration: 0.5
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0
    angular.z.max_acceleration: 2.0
    # This diff_drive_controller only accepts deceleration <= 0; a positive value fails configure.
    linear.x.max_deceleration: -0.5
    angular.z.max_deceleration: -2.0

    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

imu_sensor_broadcaster:
  ros__parameters:
    # <sensor name="..."> in the URDF and the link the IMU is mounted on.
    sensor_name: imu
    frame_id: imu_link
