controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: false
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
joint_state_broadcaster:
  ros__parameters:
    joints: [arm_yaw, arm_shoulder, arm_elbow, arm_wrist, arm_roll, finger_l, finger_r]
    interfaces: [position, velocity]
arm_trajectory_controller:
  ros__parameters:
    joints: [arm_yaw, arm_shoulder, arm_elbow, arm_wrist, arm_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 2.0
gripper_trajectory_controller:
  ros__parameters:
    joints: [finger_l]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    constraints:
      goal_time: 2.0
